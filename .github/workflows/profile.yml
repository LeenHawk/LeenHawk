name: Refresh profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 11:17 Beijing time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # STATS_TOKEN (optional, a classic PAT with read:user) also counts private
      # contributions; without it the card shows public activity only.
      - name: Render stats card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git diff --cached --quiet || git commit -m "Refresh stats card" && git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
